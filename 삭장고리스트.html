<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍶 삭장고리스트</title>
  <style>
    :root {
      --red: #7B1E1E; --gold: #C49A3C;
      --bg: #F7F2EA; --card: #FFFFFF;
      --text: #1A1009; --muted: #7A6050;
      --border: #E5D4BC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--red);
      color: #fff;
      padding: 14px 20px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,.3);
    }
    .header-inner {
      max-width: 1120px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: baseline; gap: 10px; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    .header-sub { font-size: 12px; opacity: .65; }
    .header-count {
      font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,.18);
      padding: 4px 12px; border-radius: 20px;
    }

    /* ── Controls ── */
    .controls {
      max-width: 1120px; margin: 20px auto; padding: 0 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .search-wrap { position: relative; }
    .search-wrap input {
      width: 100%; padding: 13px 18px 13px 46px;
      border: 1.5px solid var(--border); border-radius: 16px;
      font-size: 15px; font-family: inherit;
      background: #fff; color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      transition: border-color .2s;
    }
    .search-wrap input:focus { outline: none; border-color: var(--red); }
    .search-icon {
      position: absolute; left: 15px; top: 50%;
      transform: translateY(-50%);
      font-size: 18px; pointer-events: none;
    }

    /* ── Filters ── */
    .filters { display: flex; gap: 7px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 15px;
      border: 1.5px solid var(--border); border-radius: 20px;
      background: #fff; font-size: 12.5px; font-weight: 600;
      color: var(--muted); cursor: pointer; transition: all .18s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--red); color: var(--red); }
    .filter-btn.active { background: var(--red); color: #fff; border-color: var(--red); }

    /* ── Grid ── */
    .grid {
      max-width: 1120px; margin: 4px auto 0;
      padding: 0 16px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 13px;
    }

    /* ── Card ── */
    .card {
      background: var(--card); border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(123,30,30,.07);
      display: flex; overflow: hidden;
      transition: box-shadow .2s, transform .2s;
      cursor: default;
    }
    .card:hover {
      box-shadow: 0 8px 28px rgba(123,30,30,.16);
      transform: translateY(-3px);
    }

    /* Label image column */
    .card-img {
      width: 82px; flex-shrink: 0;
      background: #F0E8D8;
      border-right: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .card-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .card-img-ph {
      font-size: 38px; opacity: .22;
    }

    /* Info column */
    .card-body {
      flex: 1; padding: 13px 15px;
      display: flex; flex-direction: column; gap: 6px; min-width: 0;
    }
    .card-name {
      font-size: 15px; font-weight: 700; line-height: 1.35;
      color: var(--text);
    }
    .cat-badge {
      display: inline-block; align-self: flex-start;
      padding: 3px 9px; border-radius: 10px;
      font-size: 11px; font-weight: 700;
    }
    .card-tags {
      display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 2px;
    }
    .tag {
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 3px;
    }
    .tag-icon { font-size: 11px; }

    /* ── States ── */
    .state-wrap {
      max-width: 1120px; margin: 70px auto;
      text-align: center; padding: 0 16px;
    }
    .spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 3px solid var(--border); border-top-color: var(--red);
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-msg { color: var(--muted); font-size: 15px; }

    .error-box {
      background: #fff8f8; border: 1px solid #f0cece;
      border-radius: 16px; padding: 28px 24px;
      max-width: 480px; margin: 0 auto;
      font-size: 14px; line-height: 1.8; color: #7B1E1E;
      text-align: left;
    }
    .error-box strong { font-size: 16px; display: block; margin-bottom: 8px; }
    .error-box code {
      background: rgba(123,30,30,.1); padding: 2px 6px;
      border-radius: 5px; font-size: 12px; font-family: monospace;
    }

    .no-result {
      grid-column: 1 / -1; text-align: center;
      padding: 60px 0; color: var(--muted); font-size: 15px;
    }

    /* ── PIN screen ── */
    #pin-screen {
      position: fixed; inset: 0; z-index: 999;
      background: var(--red);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 32px;
    }
    .pin-logo { font-size: 52px; line-height: 1; }
    .pin-title { color: rgba(255,255,255,.9); font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
    .pin-sub   { color: rgba(255,255,255,.5); font-size: 13px; margin-top: -22px; }
    .pin-dots  { display: flex; gap: 16px; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: rgba(255,255,255,.25);
      transition: background .15s;
    }
    .pin-dot.filled { background: #fff; }
    .pin-pad {
      display: grid; grid-template-columns: repeat(3, 72px);
      gap: 12px;
    }
    .pin-key {
      height: 72px; border-radius: 50%;
      background: rgba(255,255,255,.15);
      border: none; color: #fff;
      font-size: 22px; font-weight: 600;
      cursor: pointer; transition: background .15s;
      font-family: inherit;
    }
    .pin-key:active, .pin-key:hover { background: rgba(255,255,255,.3); }
    .pin-key.del { font-size: 18px; }
    .pin-key.empty { background: none; pointer-events: none; }
    .pin-error {
      color: #FFB3B3; font-size: 13px; font-weight: 600;
      height: 18px; text-align: center;
      animation: shake .3s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .card-img { width: 70px; }
      .header-title { font-size: 17px; }
    }
  </style>
</head>
<body>

<!-- ── PIN Screen ── -->
<div id="pin-screen">
  <div class="pin-logo">🍶</div>
  <div class="pin-title">삭장고리스트</div>
  <div class="pin-sub">PIN을 입력하세요</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-pad">
    <button class="pin-key" onclick="pinKey('1')">1</button>
    <button class="pin-key" onclick="pinKey('2')">2</button>
    <button class="pin-key" onclick="pinKey('3')">3</button>
    <button class="pin-key" onclick="pinKey('4')">4</button>
    <button class="pin-key" onclick="pinKey('5')">5</button>
    <button class="pin-key" onclick="pinKey('6')">6</button>
    <button class="pin-key" onclick="pinKey('7')">7</button>
    <button class="pin-key" onclick="pinKey('8')">8</button>
    <button class="pin-key" onclick="pinKey('9')">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinKey('0')">0</button>
    <button class="pin-key del" onclick="pinDel()">⌫</button>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="header-left">
      <span class="header-title">🍶 삭장고리스트</span>
      <span class="header-sub">사케 컬렉션</span>
    </div>
    <span class="header-count" id="count">—</span>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="이름, 지역, 구분으로 검색…" oninput="render()">
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="" onclick="setFilter(this)">전체</button>
  </div>
</div>

<div id="grid" class="grid" style="display:none"></div>

<div id="state" class="state-wrap">
  <div class="spinner"></div>
  <div class="state-msg">목록을 불러오는 중…</div>
</div>

<script>
const SHEET_ID = '1Lv1di5KmV3UbzeD-VfI_KXWFnm5Hrgftd4WL0UUU_nI';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

// ── PIN ──────────────────────────────────────────
const CORRECT_PIN = '1124';
let pinInput = '';

(function checkSession() {
  if (sessionStorage.getItem('sake_pin') === 'ok') unlockApp();
})();

function pinKey(n) {
  if (pinInput.length >= 4) return;
  pinInput += n;
  updateDots();
  if (pinInput.length === 4) checkPin();
}

function pinDel() {
  pinInput = pinInput.slice(0, -1);
  updateDots();
  document.getElementById('pin-error').textContent = '';
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < pinInput.length);
  }
}

function checkPin() {
  if (pinInput === CORRECT_PIN) {
    sessionStorage.setItem('sake_pin', 'ok');
    document.getElementById('pin-screen').style.opacity = '0';
    document.getElementById('pin-screen').style.transition = 'opacity .3s';
    setTimeout(unlockApp, 300);
  } else {
    const err = document.getElementById('pin-error');
    err.textContent = '잘못된 PIN입니다';
    err.style.animation = 'none';
    requestAnimationFrame(() => { err.style.animation = 'shake .3s ease'; });
    pinInput = '';
    setTimeout(updateDots, 300);
  }
}

function unlockApp() {
  document.getElementById('pin-screen').style.display = 'none';
  load();
}

let allRows = [];
let activeFilter = '';

// ── CSV parser ──────────────────────────────────
function parseCSV(text) {
  const rows = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const cells = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cells.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    cells.push(cur.trim());
    rows.push(cells);
  }
  return rows;
}

function h(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Category → color ────────────────────────────
const CAT_COLOR = {
  '준마이다이긴죠': ['#6B0F1A', '#FFF0F0'],
  '준마이긴죠':     ['#8B1A2A', '#FFF3F0'],
  '다이긴죠':       ['#8B6914', '#FFFBF0'],
  '긴죠':           ['#9C6B2A', '#FFF8F0'],
  '도쿠베츠준마이': ['#1B5E37', '#F0FFF6'],
  '준마이':         ['#2E7D4F', '#F2FFF5'],
  '혼죠죠':         ['#4A5C3A', '#F5FFF0'],
  '보통주':         ['#5A5A5A', '#F5F5F5'],
  '무라벨':         ['#7A7A7A', '#FAFAFA'],
};

function catStyle(cat) {
  const [fg, bg] = CAT_COLOR[cat] || ['#7A6050', '#F5F0E8'];
  return `color:${fg};background:${bg}`;
}

// ── Load from Google Sheets CSV ─────────────────
async function load() {
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status} — 시트가 공개(뷰어) 설정인지 확인해주세요`);
    const text = await res.text();
    const rows = parseCSV(text).slice(1).filter(r => r[0]);
    allRows = rows;
    buildFilters();
    render();
    document.getElementById('state').style.display = 'none';
    document.getElementById('grid').style.display  = 'grid';
  } catch (err) {
    document.getElementById('state').innerHTML = `
      <div class="error-box">
        <strong>⚠️ 시트를 불러올 수 없습니다</strong>
        구글 시트 공유 설정을 변경해야 합니다.<br><br>
        구글 시트 → <strong>공유</strong> → <strong>링크가 있는 모든 사용자</strong> →
        <strong>뷰어</strong> 로 설정 후 새로고침 해주세요.<br><br>
        <small style="color:#B06060">오류: ${h(err.message)}</small>
      </div>`;
  }
}

// ── Build category filter buttons ───────────────
function buildFilters() {
  const cats = [...new Set(allRows.map(r => r[1]).filter(Boolean))];
  const order = ['준마이다이긴죠','준마이긴죠','다이긴죠','긴죠','도쿠베츠준마이','준마이','혼죠죠','보통주','무라벨'];
  cats.sort((a, b) => {
    const ai = order.indexOf(a), bi = order.indexOf(b);
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
  });
  const wrap = document.getElementById('filters');
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.onclick = () => setFilter(btn);
    wrap.appendChild(btn);
  });
}

function setFilter(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.cat;
  render();
}

// ── Render cards ────────────────────────────────
function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let rows = allRows;
  if (activeFilter) rows = rows.filter(r => r[1] === activeFilter);
  if (q) rows = rows.filter(r => r.join(' ').toLowerCase().includes(q));
  rows = [...rows].sort((a, b) => a[0].localeCompare(b[0], 'ko'));

  document.getElementById('count').textContent = `${rows.length}종`;

  const grid = document.getElementById('grid');
  if (!rows.length) {
    grid.innerHTML = '<div class="no-result">🔍 검색 결과가 없습니다</div>';
    return;
  }

  grid.innerHTML = rows.map(r => {
    const [name, cat, date, region, smv, heat, imgUrl] = r;
    const imgHtml = imgUrl
      ? `<img src="${h(imgUrl)}" alt="" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';

    const tags = [
      region && `<span class="tag"><span class="tag-icon">📍</span>${h(region)}</span>`,
      date   && `<span class="tag"><span class="tag-icon">📅</span>${h(date)}</span>`,
      smv    && `<span class="tag"><span class="tag-icon">💧</span>${h(smv)}</span>`,
      heat   && `<span class="tag"><span class="tag-icon">🌡️</span>${h(heat)}</span>`,
    ].filter(Boolean).join('');

    return `
    <div class="card">
      <div class="card-img">
        ${imgHtml}
        <div class="card-img-ph" style="${imgUrl ? 'display:none' : ''}">🍶</div>
      </div>
      <div class="card-body">
        <div class="card-name">${h(name)}</div>
        ${cat ? `<span class="cat-badge" style="${catStyle(cat)}">${h(cat)}</span>` : ''}
        ${tags ? `<div class="card-tags">${tags}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// load() is called by unlockApp() after PIN check
</script>
</body>
</html>

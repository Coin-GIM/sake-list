<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍶 삭장고리스트</title>
  <style>
    :root {
      --red: #7B1E1E; --red2: #A52525; --gold: #C49A3C;
      --bg: #F7F2EA; --card: #FFF; --text: #1A1009;
      --muted: #7A6050; --border: #E5D4BC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* PIN */
    #pin-screen { position: fixed; inset: 0; z-index: 999; background: var(--red); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
    .pin-logo  { font-size: 52px; }
    .pin-title { color: rgba(255,255,255,.92); font-size: 20px; font-weight: 700; }
    .pin-sub   { color: rgba(255,255,255,.5);  font-size: 13px; margin-top: -18px; }
    .pin-dots  { display: flex; gap: 16px; }
    .pin-dot   { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background .15s; }
    .pin-dot.filled { background: #fff; }
    .pin-pad   { display: grid; grid-template-columns: repeat(3, 70px); gap: 11px; }
    .pin-key   { height: 70px; border-radius: 50%; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 22px; font-weight: 600; cursor: pointer; transition: background .15s; font-family: inherit; }
    .pin-key:active, .pin-key:hover { background: rgba(255,255,255,.3); }
    .pin-key.empty { background: none; pointer-events: none; }
    .pin-error { color: #FFB3B3; font-size: 13px; font-weight: 600; height: 18px; text-align: center; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

    /* Header */
    header { background: var(--red); color: #fff; padding: 13px 18px; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 14px rgba(0,0,0,.28); }
    .header-inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 19px; font-weight: 700; }
    .header-count { font-size: 13px; font-weight: 600; background: rgba(255,255,255,.18); padding: 4px 12px; border-radius: 20px; }

    /* Tab bar */
    .tab-bar { background: #fff; border-bottom: 1.5px solid var(--border); display: flex; position: sticky; top: 47px; z-index: 100; }
    .tab-btn { flex: 1; padding: 11px 0 9px; border: none; background: none; font-size: 14.5px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; transition: color .2s, border-color .2s; }
    .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }

    /* Controls */
    .controls { max-width: 1120px; margin: 18px auto 0; padding: 0 16px; display: flex; flex-direction: column; gap: 11px; }
    .search-wrap { position: relative; }
    .search-wrap input { width: 100%; padding: 12px 16px 12px 44px; border: 1.5px solid var(--border); border-radius: 14px; font-size: 15px; font-family: inherit; background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.05); transition: border-color .2s; }
    .search-wrap input:focus { outline: none; border-color: var(--red); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; pointer-events: none; }
    .filters { display: flex; gap: 7px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 20px; background: #fff; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all .18s; white-space: nowrap; }
    .filter-btn:hover { border-color: var(--red); color: var(--red); }
    .filter-btn.active { background: var(--red); color: #fff; border-color: var(--red); }

    /* Card Grid */
    .grid { max-width: 1120px; margin: 14px auto 0; padding: 0 16px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(123,30,30,.07); display: flex; overflow: hidden; transition: box-shadow .2s, transform .2s; }
    .card:hover { box-shadow: 0 7px 24px rgba(123,30,30,.16); transform: translateY(-3px); }
    .card-img { width: 80px; flex-shrink: 0; background: #F0E8D8; border-right: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 108px; }
    .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-img-ph { font-size: 36px; opacity: .22; }
    .card-body { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .card-name { font-size: 15px; font-weight: 700; line-height: 1.35; }
    .cat-badge { display: inline-block; align-self: flex-start; padding: 3px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
    .tag { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 3px; }

    /* Prefecture Map */
    .map-outer { padding: 16px 16px 0; max-width: 1120px; margin: 0 auto; }
    .map-scroll { overflow-x: auto; padding-bottom: 8px; }
    .pref-grid { display: grid; grid-template-columns: repeat(12, 46px); grid-template-rows: repeat(16, 36px); gap: 3px; width: fit-content; }
    .pref-tile { border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 600; line-height: 1.3; text-align: center; background: #EDE5D8; color: #B0937A; border: 1px solid #DDD0BB; cursor: default; position: relative; transition: all .15s; padding: 2px; }
    .pref-tile.has-sake { background: var(--red); color: #fff; border-color: #5a1515; cursor: pointer; }
    .pref-tile.has-sake:hover { background: var(--red2); transform: scale(1.1); z-index: 2; }
    .pref-tile.selected { outline: 2.5px solid var(--gold); outline-offset: 1px; }
    .pref-badge { position: absolute; top: -6px; right: -6px; background: var(--gold); color: #fff; font-size: 9px; font-weight: 700; border-radius: 10px; padding: 1px 5px; min-width: 17px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    .map-legend { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .map-result { max-width: 1120px; margin: 20px auto 0; padding: 0 16px 60px; }
    .map-result-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1.5px solid var(--border); }
    .map-result-hd h2 { font-size: 17px; font-weight: 700; }
    .map-result-hd span { font-size: 13px; color: var(--muted); }
    .map-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

    /* States */
    .state-wrap { max-width: 1120px; margin: 70px auto; text-align: center; padding: 0 16px; }
    .spinner { display: inline-block; width: 38px; height: 38px; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-msg { color: var(--muted); font-size: 15px; }
    .error-box { background: #fff8f8; border: 1px solid #f0cece; border-radius: 14px; padding: 26px 22px; max-width: 480px; margin: 0 auto; font-size: 14px; line-height: 1.8; color: #7B1E1E; }
    .error-box strong { font-size: 15px; display: block; margin-bottom: 8px; }
    .no-result { grid-column: 1/-1; text-align: center; padding: 50px 0; color: var(--muted); font-size: 15px; }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .card-img { width: 68px; }
      .pref-grid { grid-template-columns: repeat(12, 28px); grid-template-rows: repeat(16, 24px); gap: 2px; }
      .pref-tile { font-size: 7px; border-radius: 4px; }
      .pref-badge { font-size: 8px; padding: 0 3px; top: -5px; right: -5px; min-width: 14px; }
    }
  </style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div class="pin-logo">🍶</div>
  <div class="pin-title">삭장고리스트</div>
  <div class="pin-sub">PIN을 입력하세요</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-pad">
    <button class="pin-key" onclick="pinKey('1')">1</button>
    <button class="pin-key" onclick="pinKey('2')">2</button>
    <button class="pin-key" onclick="pinKey('3')">3</button>
    <button class="pin-key" onclick="pinKey('4')">4</button>
    <button class="pin-key" onclick="pinKey('5')">5</button>
    <button class="pin-key" onclick="pinKey('6')">6</button>
    <button class="pin-key" onclick="pinKey('7')">7</button>
    <button class="pin-key" onclick="pinKey('8')">8</button>
    <button class="pin-key" onclick="pinKey('9')">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinKey('0')">0</button>
    <button class="pin-key" onclick="pinDel()">&#x232B;</button>
  </div>
</div>

<!-- Header -->
<header>
  <div class="header-inner">
    <span class="header-title">🍶 삭장고리스트</span>
    <span class="header-count" id="hd-count">&#8212;</span>
  </div>
</header>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tb-list" onclick="showTab('list')">📋 목록</button>
  <button class="tab-btn"        id="tb-map"  onclick="showTab('map')">🗾 지도</button>
</div>

<!-- LIST TAB -->
<div id="tab-list">
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="이름, 지역, 구분으로 검색&#x2026;" oninput="renderList()">
    </div>
    <div class="filters" id="filters">
      <button class="filter-btn active" data-cat="" onclick="setFilter(this)">전체</button>
    </div>
  </div>
  <div id="card-grid" class="grid" style="display:none"></div>
  <div id="state" class="state-wrap">
    <div class="spinner"></div>
    <div class="state-msg">목록을 불러오는 중&#x2026;</div>
  </div>
</div>

<!-- MAP TAB -->
<div id="tab-map" style="display:none">
  <div class="map-outer">
    <div class="map-scroll">
      <div class="pref-grid" id="pref-grid"></div>
    </div>
    <div class="map-legend">
      <div class="legend-box" style="background:var(--red)"></div> 보유 사케 있음 &nbsp;
      <div class="legend-box" style="background:#EDE5D8;border:1px solid #DDD0BB"></div> 미보유
    </div>
  </div>
  <div class="map-result" id="map-result" style="display:none">
    <div class="map-result-hd">
      <h2 id="map-result-title"></h2>
      <span id="map-result-count"></span>
    </div>
    <div class="map-card-grid" id="map-card-grid"></div>
  </div>
</div>

<script>
const SHEET_ID    = '1Lv1di5KmV3UbzeD-VfI_KXWFnm5Hrgftd4WL0UUU_nI';
const CSV_URL     = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv';
const CORRECT_PIN = '1124';

/* 47 도도부현: [표시명, [매칭별칭...], row(0-based), col(0-based)] */
const PREFS = [
  ['홋카이도',['홋카이도','북해도'],                    0,11],
  ['아오모리',['아오모리'],                             1,10],
  ['아키타',  ['아키타'],                               2, 9],
  ['이와테',  ['이와테'],                               2,10],
  ['니이가타',['니이가타','니가타'],                     3, 8],
  ['야마가타',['야마가타'],                             3, 9],
  ['미야기',  ['미야기'],                               3,10],
  ['토야마',  ['토야마','도야마'],                       4, 7],
  ['후쿠시마',['후쿠시마'],                             4, 9],
  ['토치기',  ['토치기','도치기'],                       4,10],
  ['이바라키',['이바라키'],                             4,11],
  ['이시카와',['이시카와'],                             5, 6],
  ['나가노',  ['나가노'],                               5, 8],
  ['군마',    ['군마'],                                 5, 9],
  ['사이타마',['사이타마'],                             5,10],
  ['치바',    ['치바','치바현'],                         5,11],
  ['후쿠이',  ['후쿠이'],                               6, 6],
  ['기후',    ['기후'],                                 6, 7],
  ['야마나시',['야마나시'],                             6, 8],
  ['도쿄',    ['도쿄','동경'],                           6, 9],
  ['카나가와',['카나가와','가나가와'],                   6,10],
  ['효고',    ['효고'],                                 7, 5],
  ['교토',    ['교토','경도'],                           7, 6],
  ['시가',    ['시가'],                                 7, 7],
  ['아이치',  ['아이치','아이치현'],                     7, 8],
  ['시즈오카',['시즈오카'],                             7, 9],
  ['톳토리',  ['톳토리'],                               8, 4],
  ['오사카',  ['오사카'],                               8, 5],
  ['나라',    ['나라'],                                 8, 6],
  ['미에',    ['미에'],                                 8, 7],
  ['시마네',  ['시마네'],                               9, 3],
  ['오카야마',['오카야마'],                             9, 4],
  ['히로시마',['히로시마'],                             9, 5],
  ['와카야마',['와카야마'],                             9, 6],
  ['야마구치',['야마구치'],                            10, 3],
  ['카가와',  ['카가와'],                              10, 4],
  ['토쿠시마',['토쿠시마'],                            10, 5],
  ['사가',    ['사가'],                                11, 1],
  ['후쿠오카',['후쿠오카'],                            11, 2],
  ['에히메',  ['에히메'],                              11, 4],
  ['고치',    ['고치'],                                11, 5],
  ['나가사키',['나가사키'],                            12, 1],
  ['쿠마모토',['쿠마모토'],                            12, 2],
  ['오이타',  ['오이타'],                              12, 3],
  ['미야자키',['미야자키'],                            13, 3],
  ['카고시마',['카고시마'],                            13, 2],
  ['오키나와',['오키나와'],                            15, 0],
];

let allRows = [], activeFilter = '', selectedPref = null, pinInput = '';

/* PIN */
(function(){ if (sessionStorage.getItem('sake_pin')==='ok') unlockApp(); })();
function pinKey(n){ if(pinInput.length>=4)return; pinInput+=n; updateDots(); if(pinInput.length===4)checkPin(); }
function pinDel(){ pinInput=pinInput.slice(0,-1); updateDots(); document.getElementById('pin-error').textContent=''; }
function updateDots(){ for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled',i<pinInput.length); }
function checkPin(){
  if(pinInput===CORRECT_PIN){
    sessionStorage.setItem('sake_pin','ok');
    var s=document.getElementById('pin-screen'); s.style.transition='opacity .3s'; s.style.opacity='0';
    setTimeout(unlockApp,300);
  } else {
    var err=document.getElementById('pin-error'); err.textContent='잘못된 PIN입니다';
    err.style.animation='none'; requestAnimationFrame(function(){ err.style.animation='shake .35s ease'; });
    pinInput=''; setTimeout(updateDots,350);
  }
}
function unlockApp(){ document.getElementById('pin-screen').style.display='none'; loadData(); }

/* CSV */
function parseCSV(text){
  var rows=[]; var lines=text.split(/\r?\n/);
  for(var i=0;i<lines.length;i++){
    var line=lines[i]; if(!line.trim())continue;
    var cells=[],cur='',inQ=false;
    for(var j=0;j<line.length;j++){
      var c=line[j];
      if(c==='"'){inQ=!inQ;continue;}
      if(c===','&&!inQ){cells.push(cur.trim());cur='';continue;}
      cur+=c;
    }
    cells.push(cur.trim()); rows.push(cells);
  }
  return rows;
}
function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* Load */
async function loadData(){
  try{
    var res=await fetch(CSV_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    var rows=parseCSV(await res.text()).slice(1).filter(function(r){return r[0];});
    allRows=rows;
    document.getElementById('hd-count').textContent=rows.length+'종';
    buildFilters(); renderList(); renderMap();
    document.getElementById('state').style.display='none';
    document.getElementById('card-grid').style.display='grid';
  } catch(err){
    document.getElementById('state').innerHTML='<div class="error-box"><strong>⚠️ 시트를 불러올 수 없습니다</strong>구글 시트 → <strong>공유</strong> → <strong>링크가 있는 모든 사용자 → 뷰어</strong>로 설정 후 새로고침 해주세요.<br><br><small style="color:#b06060">오류: '+h(err.message)+'</small></div>';
  }
}

/* Tab */
function showTab(tab){
  document.getElementById('tb-list').classList.toggle('active',tab==='list');
  document.getElementById('tb-map').classList.toggle('active',tab==='map');
  document.getElementById('tab-list').style.display=tab==='list'?'block':'none';
  document.getElementById('tab-map').style.display=tab==='map'?'block':'none';
}

/* Category color */
var CAT_COLOR={'준마이다이긴죠':['#6B0F1A','#FFF0F0'],'준마이긴죠':['#8B1A2A','#FFF3F0'],'다이긴죠':['#8B6914','#FFFBF0'],'긴죠':['#9C6B2A','#FFF8F0'],'도쿠베츠준마이':['#1B5E37','#F0FFF6'],'준마이':['#2E7D4F','#F2FFF5'],'혼죠죠':['#4A5C3A','#F5FFF0'],'보통주':['#5A5A5A','#F5F5F5'],'무라벨':['#7A7A7A','#FAFAFA']};
function catStyle(cat){ var c=CAT_COLOR[cat]||['#7A6050','#F5F0E8']; return 'color:'+c[0]+';background:'+c[1]; }

/* Card HTML */
function cardHTML(r){
  var name=r[0],cat=r[1],date=r[2],region=r[3],smv=r[4],heat=r[5],imgUrl=r[6];
  var imgHtml=imgUrl?'<img src="'+h(imgUrl)+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">':'';
  var tags=[region&&'<span class="tag">📍 '+h(region)+'</span>',date&&'<span class="tag">📅 '+h(date)+'</span>',smv&&'<span class="tag">💧 '+h(smv)+'</span>',heat&&'<span class="tag">🌡️ '+h(heat)+'</span>'].filter(Boolean).join('');
  return '<div class="card"><div class="card-img">'+imgHtml+'<div class="card-img-ph" '+(imgUrl?'style="display:none"':'')+'>🍶</div></div><div class="card-body"><div class="card-name">'+h(name)+'</div>'+(cat?'<span class="cat-badge" style="'+catStyle(cat)+'">'+h(cat)+'</span>':'')+(tags?'<div class="card-tags">'+tags+'</div>':'')+'</div></div>';
}

/* List */
function buildFilters(){
  var order=['준마이다이긴죠','준마이긴죠','다이긴죠','긴죠','도쿠베츠준마이','준마이','혼죠죠','보통주','무라벨'];
  var cats=[...new Set(allRows.map(function(r){return r[1];}).filter(Boolean))];
  cats.sort(function(a,b){ var ai=order.indexOf(a),bi=order.indexOf(b); return (ai<0?99:ai)-(bi<0?99:bi); });
  var wrap=document.getElementById('filters');
  cats.forEach(function(cat){
    var btn=document.createElement('button'); btn.className='filter-btn'; btn.dataset.cat=cat; btn.textContent=cat;
    btn.onclick=function(){setFilter(btn);}; wrap.appendChild(btn);
  });
}
function setFilter(btn){ document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');}); btn.classList.add('active'); activeFilter=btn.dataset.cat; renderList(); }
function renderList(){
  var q=document.getElementById('search').value.toLowerCase();
  var rows=allRows.slice();
  if(activeFilter) rows=rows.filter(function(r){return r[1]===activeFilter;});
  if(q) rows=rows.filter(function(r){return r.join(' ').toLowerCase().includes(q);});
  rows.sort(function(a,b){return a[0].localeCompare(b[0],'ko');});
  var grid=document.getElementById('card-grid');
  grid.innerHTML=rows.length?rows.map(cardHTML).join(''):'<div class="no-result">🔍 검색 결과가 없습니다</div>';
}

/* Map */
function prefMatch(region, aliases){
  if(!region) return false;
  var r=region.trim();
  return aliases.some(function(a){ return r===a||r.startsWith(a)||a.startsWith(r); });
}
var _prefRowsMap={};
function renderMap(){
  _prefRowsMap={};
  PREFS.forEach(function(p){
    var ko=p[0],aliases=p[1];
    var matched=allRows.filter(function(r){return prefMatch(r[3],aliases);});
    if(matched.length) _prefRowsMap[ko]=matched;
  });
  var grid=document.getElementById('pref-grid');
  grid.innerHTML=PREFS.map(function(p){
    var ko=p[0],row=p[2],col=p[3];
    var cnt=(_prefRowsMap[ko]||[]).length;
    var hasSake=cnt>0;
    var style='grid-row:'+(row+1)+';grid-column:'+(col+1);
    var badge=hasSake?'<span class="pref-badge">'+cnt+'</span>':'';
    var cls='pref-tile'+(hasSake?' has-sake':'');
    var click=hasSake?'onclick="selectPref(\''+ko+'\')"':'';
    return '<div class="'+cls+'" style="'+style+'" '+click+' title="'+ko+'">'+badge+'<span>'+ko+'</span></div>';
  }).join('');
}
function selectPref(ko){
  if(selectedPref===ko){
    selectedPref=null;
    document.querySelectorAll('.pref-tile').forEach(function(t){t.classList.remove('selected');});
    document.getElementById('map-result').style.display='none';
    return;
  }
  selectedPref=ko;
  document.querySelectorAll('.pref-tile').forEach(function(t){ t.classList.toggle('selected', t.title===ko); });
  var rows=(_prefRowsMap[ko]||[]).slice().sort(function(a,b){return a[0].localeCompare(b[0],'ko');});
  document.getElementById('map-result-title').textContent=ko;
  document.getElementById('map-result-count').textContent=rows.length+'종';
  document.getElementById('map-card-grid').innerHTML=rows.map(cardHTML).join('');
  var el=document.getElementById('map-result'); el.style.display='block';
  setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'});},60);
}
</script>
